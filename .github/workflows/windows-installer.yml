name: Windows offline installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Four-part Windows installer version
        required: true
        default: '2026.10.20.1'
        type: string
  push:
    branches: [glow-preview]
    paths:
      - 'portable/windows/**'
      - '.github/workflows/windows-installer.yml'
      - 'tests/windows*.py'
      - 'tests/media/yazi_native.py'
      - 'tests/validate.py'

permissions:
  contents: read

concurrency:
  group: windows-offline-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      PYTHONUTF8: '1'
      GLOW_INSTALLER_VERSION: ${{ inputs.version || '2026.10.20.1' }}
    steps:
      - name: Select isolated build directory
        run: |
          git config --global core.autocrlf false
          "GLOW_WORK_ROOT=$env:RUNNER_TEMP\glow-offline-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GLOW_FRONTEND_TARGET=$env:RUNNER_TEMP\glow-frontend-target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore frozen frontend build cache
        id: frontend_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.GLOW_FRONTEND_TARGET }}
          key: windows-2022-x64-neovide-b8b92bcc8f1e7b974e353e21f34f546dcf66bcac-rust1.99.1-crtstatic-${{ hashFiles('portable/payload/windows-icon.ico') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select x64 MSVC developer tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare locked Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: x86_64-pc-windows-msvc

      - name: Check preinstalled release-worker tools
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('git', 'python', 'cl', 'cmake', 'ninja', '7z')) {
            $null = Get-Command $name -ErrorAction Stop
          }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw 'The pinned Windows worker image no longer contains Inno Setup 6.'
          }

      - name: Compile, assemble and verify offline EXE
        run: |
          & ./portable/windows/build.ps1 -WorkRoot $env:GLOW_WORK_ROOT -Version $env:GLOW_INSTALLER_VERSION -InstallerSmokeTest

      - name: Retain frozen frontend cache after packaging failures
        if: always() && steps.frontend_cache_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.GLOW_FRONTEND_TARGET }}
          key: ${{ steps.frontend_cache_restore.outputs.cache-primary-key }}

      - name: Save installer, checksums and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Neovide-Glow-Windows-x64-offline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.GLOW_WORK_ROOT }}/output/**
            ${{ env.GLOW_WORK_ROOT }}/logs/**
            ${{ env.GLOW_FRONTEND_TARGET }}/x86_64-pc-windows-msvc/release/neovide.exe
          if-no-files-found: warn
          retention-days: 14
